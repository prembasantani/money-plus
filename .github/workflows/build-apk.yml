name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title / Version'
        required: false
        default: 'Latest Build'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js Active LTS (Node 24)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🧪 Run Engine Verification Tests
        run: npm test

      - name: ⚙️ Expo Prebuild (Generate Android Native Project)
        run: npx expo prebuild --platform android --no-install

      - name: 🔨 Build Release APK (Natively Signed via Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=../../android-release.keystore \
            -PRELEASE_STORE_PASSWORD=moneyplus123 \
            -PRELEASE_KEY_ALIAS=moneyplus \
            -PRELEASE_KEY_PASSWORD=moneyplus123 \
            --no-daemon

      - name: 🔍 Verify Alignment & Signature Integrity
        run: |
          mkdir -p build-output
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found built release APK at: $RELEASE_APK"
          cp "$RELEASE_APK" build-output/MoneyFollows.apk
          cp "$RELEASE_APK" build-output/money-plus.apk

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS"

          # 1. Verify 4-byte boundary alignment
          echo "Verifying 4-byte boundary alignment..."
          "$BUILD_TOOLS/zipalign" -c -v 4 build-output/MoneyFollows.apk

          # 2. Verify complete cryptographic signature (v1 + v2 + v3 schemes)
          echo "Verifying cryptographic signature..."
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build-output/MoneyFollows.apk
          ls -lh build-output/

      - name: 📤 Upload APK Artifact (Download from Actions tab)
        uses: actions/upload-artifact@v7
        with:
          name: money-follows-apk
          path: build-output/*.apk
          retention-days: 14

      - name: 🚀 Publish Direct Downloadable Release
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: ${{ github.event.inputs.release_title || 'MoneyFollows Latest APK Build (v1.0.20)' }}
          body: |
            ### 📱 MoneyFollows Android APK (v1.0.20)
            * **Build Date:** ${{ github.event.head_commit.timestamp || 'Manual Dispatch' }}
            * **Commit:** ${{ github.sha }}
            * **Package:** `com.moneyfollows.app`
            
            👉 **Direct Download Link:** Tap `MoneyFollows.apk` below to download and install immediately on your Android phone!
          files: |
            build-output/MoneyFollows.apk
            build-output/money-plus.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
