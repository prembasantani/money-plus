name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title / Version'
        required: false
        default: 'Latest Build'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🧪 Run Engine Verification Tests
        run: npm test

      - name: ⚙️ Expo Prebuild (Generate Android Native Project)
        run: npx expo prebuild --platform android --no-install

      - name: 🔨 Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🔑 Align & Sign APK (v1 + v2 + v3 schemes)
        run: |
          mkdir -p build-output
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found raw APK at: $RAW_APK"

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS"

          # 1. Zipalign to 4-byte boundaries
          "$BUILD_TOOLS/zipalign" -p -f 4 "$RAW_APK" build-output/aligned.apk

          # 2. Sign with permanent release keystore
          "$BUILD_TOOLS/apksigner" sign \
            --ks android-release.keystore \
            --ks-pass pass:moneyplus123 \
            --ks-key-alias moneyplus \
            --key-pass pass:moneyplus123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build-output/money-plus.apk \
            build-output/aligned.apk

          # 3. Verify signature
          "$BUILD_TOOLS/apksigner" verify --verbose build-output/money-plus.apk
          ls -lh build-output/money-plus.apk

      - name: 📤 Upload APK Artifact (Download from Actions tab)
        uses: actions/upload-artifact@v7
        with:
          name: money-plus-apk
          path: build-output/money-plus.apk
          retention-days: 14

      - name: 🚀 Publish Direct Downloadable Release
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: ${{ github.event.inputs.release_title || 'Money+ Latest APK Build' }}
          body: |
            ### 📱 Money+ Android APK
            * **Build Date:** ${{ github.event.head_commit.timestamp || 'Manual Dispatch' }}
            * **Commit:** ${{ github.sha }}
            
            👉 **Direct Download Link:** Tap `money-plus.apk` below to download and install immediately on your Android phone!
          files: build-output/money-plus.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
